[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jmcomic-onebot"
version = "2.1.0"
description = "JMComic downloader for OneBot v11 QQ groups (up to 10 chapters by default)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-only" }
authors = [{ name = "jmcomic_onebot contributors" }]
keywords = ["jmcomic", "onebot", "qq", "bot", "pdf"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "jmcomic>=2.7.9,<3.0",
    "websockets>=10.0,<18.0",
    "PyYAML>=6.0,<7.0",
    "Pillow>=10.0,<14.0",
    "pyzipper>=0.3.6,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
jm-bot = "jm_bot.main:main"

[tool.setuptools.packages.find]
include = ["jm_bot*"]

[tool.setuptools.package-data]
jm_bot = ["config.yml"]
"jm_bot.jm_pdf" = ["config.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
