# jmcomic 下载配置
#
# 机器人每次任务都会复制本文件，并在任务目录中生成专用配置：
#   - dir_rule.base_dir 指向本次任务目录
#   - dir_rule.rule 强制为 Bd_Aid_Pid
#     => <任务目录>/<漫画ID>/<章节ID>/图片
#
# 因此请不要修改 dir_rule.rule，否则机器人将无法正确识别章节。
# 其余字段可按需调整，例如代理、线程数、图片解码等。

version: '2.0'

client:
  impl: api
  retry_times: 3
  postman:
    meta_data:
      proxies: null

download:
  cache: true
  image:
    decode: true
    suffix: null
  # 2C2G 等小内存机器建议 8/2；内存充足可再调高
  threading:
    image: 8
    photo: 2

dir_rule:
  base_dir: data/work
  rule: Bd_Aid_Pid
  normalize_zh: null

log: true
